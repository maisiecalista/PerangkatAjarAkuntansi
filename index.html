<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Perangkat Ajar Akuntansi Jasa XI</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#fff6fa;--card:#fff;--tx:#4a2f3d;--mut:#a07a8c;--line:#f8dbe7;--p1:#ffd6e7;--p2:#ffe6f0;--p3:#f6dcff;--p4:#ffe1d8;--p5:#ffeef4;--p6:#ffc9dc;--ac:#ff8fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1d27;--card:#3a2733;--tx:#ffeaf2;--mut:#d3a9bd;--line:#4d3443;--p1:#5c3347;--p2:#503042;--p3:#4f3a63;--p4:#5e3d3c;--p5:#55303f;--p6:#6a3350}}
:root[data-theme="dark"]{--bg:#2b1d27;--card:#3a2733;--tx:#ffeaf2;--mut:#d3a9bd;--line:#4d3443;--p1:#5c3347;--p2:#503042;--p3:#4f3a63;--p4:#5e3d3c;--p5:#55303f;--p6:#6a3350}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 Nunito,system-ui,sans-serif}
aside{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;overflow:auto;z-index:5;transition:transform .25s}
aside h1{font-size:15px;margin:4px 8px 14px;font-weight:800}aside a{display:block;padding:9px 12px;border-radius:14px;cursor:pointer;margin:2px 0;color:var(--tx)}aside a:hover{background:var(--p1)}aside a.on{background:var(--ac);color:#4a1f33;font-weight:800}
main{margin-left:230px;padding:18px 22px 40px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}header .sp{flex:1}#hb{display:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(120,110,160,.10);margin-bottom:14px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{border-radius:20px;padding:14px;color:#4a2f3d}.st b{font-size:26px;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.b{border:0;border-radius:14px;padding:8px 14px;background:var(--p3);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}.b:hover{transform:translateY(-1px)}.b.on,.b.pri{background:var(--ac);color:#4a1f33}.b.dg{background:var(--p6);color:#5a2a3c}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 10px;max-width:100%}textarea{width:100%;min-height:150px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}td,th{border:1px solid var(--line);padding:5px 8px;text-align:left}th{background:var(--p1);color:#4a2f3d}
.ok{background:#d8f6e8!important;color:#25443a}.no{background:#ffb8cf!important;color:#6a1f3c}.bar{height:16px;border-radius:9px;background:var(--ac);color:#4a1f33;font-size:11px;padding:0 8px}.mc{height:64px;border:0;border-radius:14px;background:var(--p3);color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
#lg{min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p1),var(--p3) 50%,var(--p4));padding:20px}#lg .card{max-width:400px;width:100%;text-align:center;padding:28px}.orb{font-size:42px;letter-spacing:8px}
dialog{border:0;border-radius:20px;max-width:720px;width:92%;background:var(--card);color:var(--tx);padding:18px;max-height:88%}dialog::backdrop{background:rgba(40,35,70,.35)}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#d6578a;color:#fff;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}#toast.s{opacity:1}
.doc{white-space:pre-wrap}.tw{overflow-x:auto}h2,h3,h4{margin:.4em 0}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.o{transform:none}main{margin-left:0;padding:14px}#hb{display:inline-block}.grid4{grid-template-columns:repeat(3,1fr)}}
@media(print){aside,header,.np,#toast{display:none!important}main{margin:0}.card{box-shadow:none}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div><dialog id="dl"></dialog><div id="toast"></div><script>
// ===== Data & penyimpanan =====
const K='pa-jasa-xi-v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>n<0?'('+rp(-n)+')':'Rp'+n.toLocaleString('id-ID'),sh=a=>[...a].sort(()=>Math.random()-.5);
let S,page='dash',U={};
const NM=['Aisyah Putri','Budi Santoso','Citra Lestari','Dimas Pratama','Eka Wulandari','Fajar Nugroho','Gita Permata','Hendra Wijaya','Indah Sari','Joko Susilo'];
const def=()=>({user:'',kelas:[{id:1,n:'XI Akuntansi 1'},{id:2,n:'XI Akuntansi 2'},{id:3,n:'XI Akuntansi 3'}],aktif:1,siswa:{},hadir:{},nilai:{},jadwal:{},docs:null,mat:null,g:{},skor:{},log:[],theme:'',pal:0,set:{sekolah:'SMK Negeri 1 Contoh',guru:'',ta:'2026/2027',smt:'Ganjil',kktp:75}});
function load(){try{S=JSON.parse(localStorage.getItem(K))||def()}catch(e){S=def()}S.docs=S.docs||TPL.map((t,i)=>({id:i+1,t:t[0],b:fill(t[1],{sekolah:'SMK Negeri 1 Contoh',guru:'Guru Mapel',kelas:'XI Akuntansi',smt:'Ganjil',ta:'2026/2027'})}));S.mat=S.mat||JSON.parse(JSON.stringify(MAT));S.log=S.log||[]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)},act=m=>{S.log.unshift(new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' · '+m);S.log=S.log.slice(0,8);save()};
const openM=h=>{$('#dl').innerHTML=h+'<div class=row><button class=b onclick="$(\'#dl\').close()">Tutup</button></div>';$('#dl').showModal()};
const showText=(t,x)=>openM(`<h3>${t}</h3><p>Salin teks di bawah ini.</p><textarea readonly onclick="this.select()">${esc(x)}</textarea>`);
const cur=()=>S.kelas.find(k=>k.id==S.aktif)||S.kelas[0]||{id:0,n:'(belum ada kelas)'};
const sis=()=>{const c=cur().id;if(!S.siswa[c])S.siswa[c]=NM.slice();return S.siswa[c]};
const avg=n=>n?+(n.t*.2+n.k*.2+n.u*.3+n.a*.3).toFixed(1):0;
function theme(){const P=[['#ff8fb8'],['#ff9aa8'],['#f2a0e0'],['#ffb3a0']][S.pal||0],r=document.documentElement;r.style.setProperty('--ac',P[0]);S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme')}
// ===== Konten bawaan =====
const fill=(b,v)=>b.replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
const TPL=[['Capaian Pembelajaran (CP)','CAPAIAN PEMBELAJARAN\nSatuan Pendidikan: {sekolah}\nMapel: Praktik Akuntansi Perusahaan Jasa · Kelas {kelas} · Semester {smt} · TA {ta}\n\nPada akhir fase F, peserta didik mampu mengelola siklus akuntansi perusahaan jasa: menganalisis bukti transaksi, mencatat ke jurnal, memposting ke buku besar, menyusun neraca saldo, jurnal penyesuaian, neraca lajur, laporan keuangan, dan jurnal penutup sesuai SAK EMKM, secara teliti, jujur, dan bertanggung jawab.'],
['Tujuan Pembelajaran (TP)','TUJUAN PEMBELAJARAN · {kelas}\n1. Menganalisis bukti transaksi dan persamaan dasar akuntansi.\n2. Mencatat transaksi ke jurnal umum dengan benar.\n3. Memposting jurnal ke buku besar dan menghitung saldo.\n4. Menyusun neraca saldo.\n5. Membuat jurnal penyesuaian.\n6. Menyusun neraca lajur.\n7. Menyusun laporan laba rugi, perubahan modal, dan neraca.\n8. Membuat jurnal penutup dan neraca saldo setelah penutupan.'],
['Alur Tujuan Pembelajaran (ATP)','ALUR TUJUAN PEMBELAJARAN · Semester {smt} {ta}\nMinggu 1-2: Persamaan dasar & bukti transaksi\nMinggu 3-5: Jurnal umum\nMinggu 6-8: Buku besar\nMinggu 9: Neraca saldo & asesmen sumatif tengah semester\nMinggu 10-12: Jurnal penyesuaian\nMinggu 13-14: Neraca lajur\nMinggu 15-17: Laporan keuangan\nMinggu 18-19: Jurnal penutup & neraca saldo setelah penutupan\nMinggu 20: Asesmen sumatif akhir'],
['Modul Ajar','MODUL AJAR\nIdentitas: {sekolah} · Penyusun: {guru} · Kelas {kelas} · Semester {smt} · TA {ta}\nKompetensi awal: memahami konsep dasar akuntansi dan persamaan akuntansi.\nProfil Pelajar Pancasila: bernalar kritis, mandiri, gotong royong.\nSarana: papan tulis, LKPD, laptop/aplikasi akuntansi, proyektor.\nModel: Problem Based Learning (studi kasus perusahaan jasa).\n\nPENDAHULUAN (15 menit): salam, doa, apersepsi, tujuan.\nINTI (60 menit): orientasi masalah, diskusi kelompok mengerjakan LKPD, presentasi, penguatan guru.\nPENUTUP (15 menit): simpulan, kuis singkat, refleksi.\nAsesmen: formatif (kuis, observasi), sumatif (tes tertulis & praktik).\nPengayaan: studi kasus lanjutan. Remedial: pembelajaran ulang dengan tutor sebaya.\nRefleksi guru & siswa: apa yang sudah dipahami, apa yang masih sulit?'],
['Program Tahunan & Semester','PROGRAM TAHUNAN · {sekolah} · TA {ta}\nSemester Ganjil: Persamaan dasar, Jurnal umum, Buku besar, Neraca saldo (± 72 JP)\nSemester Genap: Jurnal penyesuaian, Neraca lajur, Laporan keuangan, Jurnal penutup (± 72 JP)\n\nPROGRAM SEMESTER {smt}\nAlokasi: 18 minggu efektif, 4 JP/minggu. Ulangan harian di akhir tiap bab, sumatif di minggu 9 dan 20.'],
['Bahan Ajar & Media','BAHAN AJAR RINGKAS\nSiklus akuntansi: bukti transaksi → jurnal → buku besar → neraca saldo → penyesuaian → neraca lajur → laporan keuangan → penutup.\nAset = Kewajiban + Modal.\n\nMEDIA: slide presentasi, LKPD studi kasus, simulasi transaksi pada website ini, formulir jurnal dan buku besar, kuis dan games.'],
['Rubrik & Instrumen Asesmen','RUBRIK PENILAIAN LKPD (skor 1-4)\nKetepatan akun (40%): 4 = semua tepat; 3 = 1-2 salah; 2 = 3-4 salah; 1 = lebih dari 4 salah.\nKetepatan nominal & saldo seimbang (40%)\nKerapian & ketepatan waktu (20%)\n\nInstrumen: kuis pilihan ganda, tes uraian jurnal, lembar observasi sikap teliti dan jujur.']];
const MAT=[['Persamaan dasar akuntansi dan bukti transaksi','Persamaan dasar: Aset = Kewajiban + Modal. Setiap transaksi harus didukung bukti (kuitansi, faktur, nota) dan selalu menjaga persamaan tetap seimbang.',[['Persamaan dasar akuntansi adalah ...','Aset = Kewajiban + Modal|Aset = Modal − Kewajiban|Kewajiban = Aset + Modal|Modal = Aset + Kewajiban',0,'Aset dibiayai oleh kewajiban dan modal pemilik.'],['Pemilik menyetor kas Rp5.000.000. Pengaruhnya ...','Aset dan modal bertambah|Aset dan kewajiban bertambah|Aset berkurang, modal bertambah|Kewajiban dan modal bertambah',0,'Kas (aset) naik, modal naik dengan jumlah sama.']]],
['Jurnal umum','Jurnal mencatat transaksi secara kronologis. Akun yang didebit ditulis di baris pertama rata kiri, akun yang dikredit di baris berikutnya menjorok ke kanan. Total debit harus sama dengan total kredit.',[['Beli perlengkapan kredit Rp1.000.000. Jurnalnya ...','Perlengkapan (D) / Utang Usaha (K)|Perlengkapan (D) / Kas (K)|Utang Usaha (D) / Perlengkapan (K)|Beban Perlengkapan (D) / Kas (K)',0,'Perlengkapan bertambah (debit), kewajiban timbul (kredit Utang Usaha).'],['Akun yang didebit dalam jurnal ditulis ...','Di sebelah kiri, rata kiri|Di sebelah kanan, menjorok|Di tengah|Tidak perlu ditulis',0,'Aturan penulisan jurnal: debit dahulu, kredit menjorok.']]],
['Posting ke buku besar','Posting adalah memindahkan angka dari jurnal ke akun buku besar. Kolom Ref diisi nomor akun setelah posting dilakukan.',[['Sumber posting ke buku besar adalah ...','Jurnal umum|Neraca saldo|Laporan laba rugi|Neraca lajur',0,'Posting dilakukan dari jurnal umum.'],['Kolom Ref di jurnal diisi ketika ...','Akun sudah diposting|Transaksi terjadi|Neraca lajur selesai|Akun ditutup',0,'Ref menandai bahwa posting telah selesai.']]],
['Neraca saldo','Neraca saldo memuat saldo semua akun buku besar pada tanggal tertentu untuk membuktikan total debit sama dengan total kredit.',[['Tujuan neraca saldo adalah ...','Membuktikan keseimbangan total debit dan kredit|Menghitung laba|Mencatat transaksi|Menutup akun',0,'Neraca saldo adalah alat uji keseimbangan.'],['Total debit ≠ total kredit menunjukkan kemungkinan ...','Kesalahan posting atau penghitungan saldo|Laba terlalu besar|Modal bertambah|Tidak ada masalah',0,'Periksa kembali jurnal, posting, dan saldo.']]],
['Jurnal penyesuaian','Jurnal penyesuaian dibuat akhir periode agar akun sesuai kondisi sebenarnya: perlengkapan, penyusutan, beban dibayar di muka, pendapatan diterima di muka.',[['Perlengkapan awal Rp3.000.000, sisa Rp1.000.000. Jurnal penyesuaian ...','Beban Perlengkapan (D) 2.000.000 / Perlengkapan (K)|Perlengkapan (D) 2.000.000 / Beban Perlengkapan (K)|Beban Perlengkapan (D) 1.000.000 / Kas (K)|Kas (D) / Perlengkapan (K)',0,'Perlengkapan terpakai = 3.000.000 − 1.000.000 = 2.000.000.'],['Penyusutan peralatan dicatat dengan ...','Beban Penyusutan (D) / Akumulasi Penyusutan (K)|Akumulasi Penyusutan (D) / Beban Penyusutan (K)|Peralatan (D) / Kas (K)|Kas (D) / Peralatan (K)',0,'Akumulasi penyusutan adalah akun pengurang aset.']]],
['Neraca lajur','Neraca lajur adalah kertas kerja bermacam kolom: neraca saldo, penyesuaian, neraca saldo setelah penyesuaian, laba rugi, dan neraca.',[['Kolom neraca lajur secara berurutan ...','NS, penyesuaian, NSSP, laba rugi, neraca|Jurnal, buku besar, neraca|Debit saja|Laba rugi saja',0,'Itulah susunan neraca lajur 10 kolom.'],['Akun Prive dipindahkan ke kolom ...','Neraca (debit)|Laba rugi (kredit)|Laba rugi (debit)|Penyesuaian (kredit)',0,'Prive berpengaruh pada modal dan masuk ke kolom neraca.']]],
['Laporan keuangan (laba rugi, perubahan modal, neraca)','Urutan: laporan laba rugi → laporan perubahan modal → neraca. Modal akhir = modal awal + laba bersih − prive.',[['Urutan penyusunan laporan keuangan ...','Laba rugi, perubahan modal, neraca|Neraca, laba rugi, perubahan modal|Perubahan modal, neraca, laba rugi|Neraca saja',0,'Laba dibutuhkan untuk modal akhir, modal akhir dibutuhkan untuk neraca.'],['Modal akhir = ...','Modal awal + laba − prive|Modal awal − laba + prive|Modal awal + prive|Laba − prive',0,'Laba menambah modal, prive mengurangi modal.']]],
['Jurnal penutup dan neraca saldo setelah penutupan','Akun nominal (pendapatan, beban, prive) ditutup ke Ikhtisar Laba Rugi dan Modal. Setelah penutupan hanya akun riil yang bersaldo.',[['Akun yang ditutup pada akhir periode ...','Pendapatan, beban, dan prive|Kas dan piutang|Utang dan modal|Peralatan',0,'Akun nominal ditutup, akun riil tidak.'],['Menutup akun pendapatan jasa dilakukan dengan ...','Debit Pendapatan Jasa, kredit Ikhtisar Laba Rugi|Debit Ikhtisar L/R, kredit Pendapatan Jasa|Debit Kas, kredit Pendapatan|Debit Modal, kredit Prive',0,'Saldo kredit pendapatan didebit agar menjadi nol.']]]];
const ACC=['Kas','Piutang Usaha','Perlengkapan','Sewa Dibayar di Muka','Peralatan','Akumulasi Penyusutan Peralatan','Utang Usaha','Pendapatan Diterima di Muka','Modal Pemilik','Prive','Ikhtisar Laba Rugi','Pendapatan Jasa','Beban Gaji','Beban Listrik','Beban Perlengkapan','Beban Sewa','Beban Penyusutan Peralatan'];
// ===== Tabel akuntansi (semua saldo dihitung otomatis -> selalu seimbang) =====
function jt(es){let T=0,r='<div class=tw><table><tr><th>Keterangan<th>Akun<th>Debit<th>Kredit</tr>';es.forEach((e,i)=>{T+=e[3];r+=`<tr><td>${i+1}. ${e[0]}<td>${e[1]}<td>${rp(e[3])}<td></tr><tr><td><td>&emsp;${e[2]}<td><td>${rp(e[3])}</tr>`});return r+`<tr><th colspan=2>Total<th>${rp(T)}<th>${rp(T)}</tr></table></div>`}
const tb=(es,base)=>{const m=new Map(base||[]);es.forEach(e=>{m.set(e[1],(m.get(e[1])||0)+e[3]);m.set(e[2],(m.get(e[2])||0)-e[3])});return m};
function tbt(m){let D=0,K=0,r='<div class=tw><table><tr><th>Akun<th>Debit<th>Kredit</tr>';[...m].filter(x=>x[1]).sort((a,b)=>ACC.indexOf(a[0])-ACC.indexOf(b[0])).forEach(([a,v])=>{v>0?D+=v:K-=v;r+=`<tr><td>${a}<td>${v>0?rp(v):''}<td>${v<0?rp(-v):''}</tr>`});return r+`<tr><th>Total<th>${rp(D)}<th>${rp(K)}</tr></table></div><p class=${D==K?'ok':'no'} style="padding:6px 10px;border-radius:10px">${D==K?'✔ Seimbang':'✖ Tidak seimbang'}</p>`}
function lap(m){const g=f=>[...m].filter(([a,v])=>f(a)&&v),sm=l=>l.reduce((s,x)=>s+x[1],0),pe=g(a=>a.startsWith('Pendapatan Jasa')),be=g(a=>a.startsWith('Beban')),pv=m.get('Prive')||0,mo=-(m.get('Modal Pemilik')||0),R=-sm(pe),B=sm(be),L=R-B,MA=mo+L-pv,as=g(a=>['Kas','Piutang Usaha','Perlengkapan','Peralatan','Akumulasi Penyusutan Peralatan'].includes(a)),A=sm(as),Ut=-(m.get('Utang Usaha')||0),w=(a,v)=>`<tr><td>${a}<td>${rp(v)}</tr>`;
return `<div class=tw><h4>Laporan Laba Rugi</h4><table>${w('Pendapatan Jasa',R)}${be.map(x=>w(x[0],x[1])).join('')}${w('Total Beban',B)}${w('Laba Bersih',L)}</table><h4>Laporan Perubahan Modal</h4><table>${w('Modal Awal',mo)}${w('Laba Bersih',L)}${w('Prive',-pv)}${w('Modal Akhir',MA)}</table><h4>Neraca</h4><table>${as.map(x=>w(x[0],x[1])).join('')}${w('Total Aset',A)}${w('Utang Usaha',Ut)}${w('Modal Akhir',MA)}${w('Total Kewajiban + Modal',Ut+MA)}</table></div><p class=${A==Ut+MA?'ok':'no'} style="padding:6px 10px;border-radius:10px">${A==Ut+MA?'✔ Neraca seimbang':'✖ Neraca tidak seimbang'}</p>`}
const blank=n=>'<div class=tw><table><tr><th>Tanggal<th>Akun<th>Debit<th>Kredit</tr>'+'<tr><td>&nbsp;<td><td><td></tr>'.repeat(n)+'</table></div>';
const C1=[['2 Jan: Pemilik menyetor kas','Kas','Modal Pemilik',20e6],['4 Jan: Beli peralatan salon tunai','Peralatan','Kas',5e6],['6 Jan: Beli perlengkapan kredit','Perlengkapan','Utang Usaha',1e6],['9 Jan: Terima pendapatan jasa tunai','Kas','Pendapatan Jasa',3e6],['12 Jan: Bayar gaji karyawan','Beban Gaji','Kas',1.5e6],['15 Jan: Bayar sebagian utang usaha','Utang Usaha','Kas',6e5],['20 Jan: Jasa kepada pelanggan secara kredit','Piutang Usaha','Pendapatan Jasa',2e6],['25 Jan: Pemilik mengambil kas pribadi','Prive','Kas',5e5]];
const C2A=[['Perlengkapan tersisa Rp1.000.000','Beban Perlengkapan','Perlengkapan',2e6],['Penyusutan peralatan periode ini','Beban Penyusutan Peralatan','Akumulasi Penyusutan Peralatan',1e6],['Sewa 6 dari 12 bulan telah terpakai','Beban Sewa','Sewa Dibayar di Muka',3e6],['Pendapatan diterima di muka yang sudah diperoleh','Pendapatan Diterima di Muka','Pendapatan Jasa',7e5]];

function dSave(id){const d=S.docs.find(x=>x.id==id);d.t=$('#et').value;d.b=$('#eb').value;act('Edit '+d.t);$('#dl').close();toast('Tersimpan');render()}
const dDup=id=>{const d=S.docs.find(x=>x.id==id);S.docs.unshift({id:Date.now(),t:d.t+' (salinan)',b:d.b});save();render();toast('Diduplikat')},dDel=id=>{if(confirm('Hapus dokumen?')){S.docs=S.docs.filter(x=>x.id!=id);save();render()}};
const mAdd=()=>{S.mat.push(['Materi baru','Isi materi...',[]]);U.mi=S.mat.length-1;save();render()},mDel=i=>{if(confirm('Hapus materi?')){S.mat.splice(i,1);U.mi=0;save();render()}},qDel=(i,j)=>{S.mat[i][2].splice(j,1);save();render()};
function qAdd(i){openM(`<h3>Tambah soal</h3><input id=q0 placeholder="Pertanyaan" style="width:100%"><input id=q1 placeholder="Pilihan A (jawaban benar)" style="width:100%"><input id=q2 placeholder="Pilihan B" style="width:100%"><input id=q3 placeholder="Pilihan C" style="width:100%"><input id=q4 placeholder="Pilihan D" style="width:100%"><input id=q5 placeholder="Pembahasan" style="width:100%"><button class="b pri" onclick="qSave(${i})">Simpan soal</button>`)}
function qSave(i){const v=[0,1,2,3,4,5].map(n=>$('#q'+n).value.trim());if(v.slice(0,5).some(x=>!x))return toast('Lengkapi soal');S.mat[i][2].push([v[0],v.slice(1,5).join('|'),0,v[5]]);save();$('#dl').close();render();toast('Soal ditambah')}
function qPlay(i){const qs=S.mat[i][2];if(!qs.length)return toast('Belum ada soal');U.qz=qs.map(q=>{const o=q[1].split('|').map((t,x)=>[t,x==q[2]]);return{q:q[0],o:sh(o),e:q[3]}});openM(`<h3>Kuis</h3>${U.qz.map((q,a)=>`<p><b>${a+1}. ${esc(q.q)}</b></p>${q.o.map((o,b)=>`<label><input type=radio name=z${a} value=${b}> ${esc(o[0])}</label><br>`).join('')}<div id=pb${a}></div>`).join('')}<div id=sc></div><button class="b pri" onclick=qEnd()>Selesai & lihat skor</button>`)}
function qEnd(){let s=0;U.qz.forEach((q,a)=>{const c=document.querySelector(`input[name=z${a}]:checked`),ok=c&&q.o[c.value][1];if(ok)s++;$('#pb'+a).innerHTML=`<p class="${ok?'ok':'no'}" style="padding:6px 10px;border-radius:10px">${ok?'Benar':'Kurang tepat'}. Jawaban: ${esc(q.o.find(o=>o[1])[0])}. ${esc(q.e)}</p>`});$('#sc').innerHTML=`<h3>Skor: ${Math.round(s/U.qz.length*100)} (${s}/${U.qz.length})</h3>`;act('Kuis selesai, skor '+Math.round(s/U.qz.length*100))}
// Games
const GC={dk:{n:'Debit atau Kredit?',o:[['D','Debit'],['K','Kredit']],d:['Kas bertambah|D','Pendapatan Jasa bertambah|K','Beban Gaji bertambah|D','Utang Usaha bertambah|K','Prive bertambah|D','Modal bertambah|K','Piutang Usaha berkurang|K','Perlengkapan bertambah|D','Utang Usaha berkurang|D','Kas berkurang|K','Peralatan bertambah|D','Pendapatan Diterima di Muka bertambah|K']},
akun:{n:'Tebak Akun',o:['Aset','Kewajiban','Modal','Pendapatan','Beban'].map(x=>[x,x]),d:['Kas|Aset','Piutang Usaha|Aset','Peralatan|Aset','Perlengkapan|Aset','Utang Usaha|Kewajiban','Pendapatan Diterima di Muka|Kewajiban','Modal Pemilik|Modal','Prive|Modal','Pendapatan Jasa|Pendapatan','Beban Gaji|Beban','Beban Listrik|Beban','Beban Penyusutan Peralatan|Beban']},
mem:{n:'Kartu Memori',d:['Debit|Sisi kiri akun','Kredit|Sisi kanan akun','Aset|Sumber daya milik usaha','Prive|Pengambilan kas pribadi pemilik','Jurnal|Pencatatan kronologis transaksi','Neraca saldo|Daftar saldo akun uji keseimbangan']}};
let G=null,M=null;
function gsub(k,keep){U.sub=k;if(G)clearInterval(G.iv);G=null;const c=GC[k],L=S.g[k]||c.d;$('#gm').innerHTML=`<h3>${c.n}</h3><div class=row><button class="b pri" onclick="${k=='mem'?'mem()':`gst('${k}')`}">Main</button><button class=b onclick="gEdit('${k}')">Edit soal/kartu</button></div><div id=gp></div>`;$('#gs').innerHTML=`<div class=card><b>Papan skor</b>${(S.skor[k]||[]).map(x=>`<p>${esc(x[0])}: ${x[1]}`).join('')||'<p>Belum ada skor.'}</div>`}
function gst(k){const L=(S.g[k]||GC[k].d).map(l=>l.split('|'));G={k,it:sh(L),i:0,sc:0,t:45};G.iv=setInterval(()=>{if(!$('#gp')){clearInterval(G.iv);return}if(--G.t<=0)gend();else $('#gt')&&($('#gt').textContent=G.t)},1000);gq()}
function gq(){const x=G.it[G.i%G.it.length];$('#gp').innerHTML=`<p><b>⏱ <span id=gt>${G.t}</span> dtk · Skor ${G.sc}</b></p><h2>${esc(x[0])}</h2><div class=row>${GC[G.k].o.map(o=>`<button class=b onclick="gans('${o[0]}')">${o[1]}</button>`).join('')}</div>`}
function gans(v){const x=G.it[G.i%G.it.length];if(v==x[1]){G.sc+=10;toast('Benar! +10')}else{G.sc=Math.max(0,G.sc-5);toast('Salah, −5')}G.i++;gq()}
function gend(){clearInterval(G.iv);const a=S.skor[G.k]=S.skor[G.k]||[];a.push([S.user,G.sc]);a.sort((x,y)=>y[1]-x[1]);S.skor[G.k]=a.slice(0,5);save();$('#gp').innerHTML=`<h2>Waktu habis! Skor ${G.sc}</h2><button class="b pri" onclick="gst('${G.k}')">Main lagi</button>`;gsub(G.k,1);$('#gp').innerHTML=`<h3>Skor akhir: ${G.sc}</h3><button class="b pri" onclick="gst('${U.sub}')">Main lagi</button>`}
function mem(){const p=(S.g.mem||GC.mem.d).map(l=>l.split('|'));M={cs:sh(p.flatMap((x,i)=>[[i,x[0]],[i,x[1]]])),open:[],done:[],mv:0};mr()}
function mr(){if(!$('#gp'))return;$('#gp').innerHTML=`<p>Langkah: ${M.mv}</p><div class=grid4>${M.cs.map((c,i)=>`<button class="mc ${M.done.includes(i)?'ok':''}" onclick="mf(${i})">${M.open.includes(i)||M.done.includes(i)?esc(c[1]):'?'}</button>`).join('')}</div>`+(M.done.length==M.cs.length?`<p>🎉 Selesai dalam ${M.mv} langkah <button class="b pri" onclick=mem()>Main lagi</button></p>`:'');if(M.done.length==M.cs.length&&!M.sv){M.sv=1;const a=S.skor.mem=S.skor.mem||[];a.push([S.user,Math.max(0,100-M.mv*5)]);a.sort((x,y)=>y[1]-x[1]);S.skor.mem=a.slice(0,5);save()}}
function mf(i){if(M.open.length==2||M.open.includes(i)||M.done.includes(i))return;M.open.push(i);if(M.open.length==2){M.mv++;const[a,b]=M.open;if(M.cs[a][0]==M.cs[b][0]){M.done.push(a,b);M.open=[]}else setTimeout(()=>{M.open=[];mr()},900)}mr()}
function gEdit(k){openM(`<h3>Edit ${GC[k].n}</h3><p>Satu baris: teks|jawaban (kartu: istilah|arti)</p><textarea id=ge>${esc((S.g[k]||GC[k].d).join('\n'))}</textarea><button class="b pri" onclick="S.g['${k}']=$('#ge').value.split('\\n').filter(x=>x.includes('|'));save();$('#dl').close();toast('Tersimpan')">Simpan</button>`)}
// LKPD generator & simulasi
function lGen(){const m=S.mat[$('#gm1').value],n=+$('#gn').value||2,qs=sh(m[2]).slice(0,n);U.g=`LKPD: ${m[0]}\n${S.set.sekolah} · ${cur().n} · Tingkat: ${$('#gl').value}\nTujuan: memahami ${m[0].toLowerCase()}.\n\nSoal:\n`+qs.map((q,i)=>`${i+1}. ${q[0]}\n   ${q[1].split('|').map((o,j)=>'ABCD'[j]+'. '+o).join('  ')}`).join('\n')+'\n\nKunci:\n'+qs.map((q,i)=>`${i+1}. ${q[1].split('|')[q[2]]}`).join('\n');act('LKPD dibuat: '+m[0]);render()}
function sa(i,f,v){(U.ans[i]=U.ans[i]||[])[f]=v;let D=0,c=0,L=SIM[U.lv].es.length;U.ans.forEach(a=>{if(a&&a[0]&&a[1]&&a[0]!=a[1]&&+a[2]>0){D+=+a[2];c++}});$('#bl').innerHTML=`Debit ${rp(D)} · Kredit ${rp(D)} · <b class="${c==L?'ok':''}">${c==L?'✔ Seimbang':c+'/'+L+' baris lengkap'}</b>`}
function sChk(){const L=SIM[U.lv].es;let ok=0;L.forEach((e,i)=>{const a=U.ans[i]||[];if(a[0]==e[1]&&a[1]==e[2]&&+a[2]==e[3])ok++});const sc=Math.round(ok/L.length*100),st=sc>=90?3:sc>=70?2:sc>=40?1:0;U.chk=1;U.msg=`Skor ${sc} · ${ok}/${L.length} benar · ${'★'.repeat(st)||'belum ada bintang'}`;S.skor['s'+U.lv]=Math.max(S.skor['s'+U.lv]||0,st);act(SIM[U.lv].n+': skor '+sc);render();U.msg=''}
// Alat bantu
const sList=()=>{const q=(U.q||'').toLowerCase();return sis().map((n,i)=>[n,i]).filter(x=>x[0].toLowerCase().includes(q)).map(([n,i])=>`<div class=row><span style="width:26px">${i+1}.</span><input value="${esc(n)}" onchange="sis()[${i}]=this.value;save();toast('Tersimpan')"><button class="b dg" onclick="if(confirm('Hapus siswa?')){sis().splice(${i},1);save();render()}">Hapus</button></div>`).join('')||'<p>Belum ada siswa.'};
const sAdd=()=>{const n=$('#ns').value.trim();if(!n)return toast('Isi nama');sis().push(n);save();render();toast('Siswa ditambah')};
const sImp=()=>openM(`<h3>Impor nama (satu nama per baris)</h3><textarea id=im></textarea><button class="b pri" onclick="im2()">Impor</button>`),im2=()=>{const l=$('#im').value.split('\n').map(x=>x.trim()).filter(Boolean);sis().push(...l);save();$('#dl').close();render();toast(l.length+' siswa diimpor')};
function pSave(d){const H=S.hadir[cur().id],o={};sis().forEach((n,i)=>o[n]=$('#p'+i).value);H[d]=o;act('Presensi '+cur().n+' '+d);toast('Presensi tersimpan');render()}
function pCsv(){const H=S.hadir[cur().id]||{};let r='nama,tanggal,status\n';Object.keys(H).forEach(d=>Object.keys(H[d]).forEach(n=>r+=`"${n}",${d},${H[d][n]}\n`));showText('Ekspor presensi (CSV)',r)}
function nSet(n,f,v){const N=S.nilai[cur().id];N[n]=N[n]||{t:0,k:0,u:0,a:0};N[n][f]=Math.min(100,Math.max(0,+v||0));save();render();toast('Nilai tersimpan')}
function nImp(){openM(`<h3>Unggah nilai (CSV)</h3><input type=file accept=".csv,text/csv" onchange="fr(this)"><p>atau tempel isi CSV (nama,tugas,kuis,uts,uas):</p><textarea id=cv></textarea><button class=b onclick=nPrev()>Pratinjau</button><div id=pv></div>`)}
function fr(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#cv').value=r.result;nPrev()};r.readAsText(f)}
function nPrev(){U.rows=$('#cv').value.split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r.length>=5&&!isNaN(+r[1]));$('#pv').innerHTML=`<p>${U.rows.length} baris terbaca.</p><div class=tw><table>${U.rows.map(r=>`<tr>${r.slice(0,5).map(x=>`<td>${esc(x)}`).join('')}</tr>`).join('')}</table></div><button class="b pri" onclick=nSv()>Simpan nilai</button>`}
function nSv(){const N=S.nilai[cur().id]=S.nilai[cur().id]||{},ss=sis();U.rows.forEach(r=>{N[r[0]]={t:+r[1],k:+r[2],u:+r[3],a:+r[4]};if(!ss.includes(r[0]))ss.push(r[0])});act('Impor nilai '+U.rows.length+' siswa');$('#dl').close();render();toast('Nilai tersimpan')}
const iJson=()=>openM(`<h3>Impor data (JSON)</h3><textarea id=ij></textarea><button class="b pri" onclick="try{S=JSON.parse($('#ij').value);save();location.reload()}catch(e){toast('JSON tidak valid')}">Impor</button>`);
load();render();
</script></body></html>
